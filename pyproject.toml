[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "n8n-tidy"
version = "0.1.1"
description = "Normalize, semantically diff and check n8n workflow exports for git - no n8n instance needed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["n8n", "git", "diff", "workflow", "pre-commit", "textconv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/LeeGyeongPil/n8n-tidy"
Issues = "https://github.com/LeeGyeongPil/n8n-tidy/issues"
Changelog = "https://github.com/LeeGyeongPil/n8n-tidy/blob/main/CHANGELOG.md"

[project.scripts]
n8n-tidy = "n8n_tidy.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/n8n_tidy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
